<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="100" fill="url(#avatarGlow)" />

  <!-- Avatar silhouette / streamer camera illustration -->
  <!-- Head -->
  <circle cx="100" cy="72" r="32" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Headphones -->
  <path d="M 60 72 A 40 40 0 0 1 140 72" stroke="#1e1b4b" stroke-width="8" fill="none" stroke-linecap="round" />
  <rect x="54" y="62" width="12" height="22" rx="6" fill="#1e1b4b" />
  <rect x="134" y="62" width="12" height="22" rx="6" fill="#1e1b4b" />
  
  <!-- Mic headset boom -->
  <path d="M 60 78 Q 50 100 80 104" stroke="#1e1b4b" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="82" cy="104" r="5" fill="#ef4444" />

  <!-- Torso / Shoulders -->
  <path d="M 46 160 C 48 122 72 112 100 112 C 128 112 152 122 154 160 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Decorative Live badge text or waveform -->
  <g transform="translate(68, 168)">
    <rect x="0" y="0" width="64" height="20" rx="10" fill="#ef4444" />
    <text x="32" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">LIVE</text>
  </g>
</svg>
