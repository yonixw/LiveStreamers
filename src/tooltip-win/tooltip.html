<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveStreamers Tooltip</title>
    <link rel="stylesheet" href="tooltip.css" />
</head>

<body>
    <div id="tooltip-card" class="tooltip-card">
        <div class="tooltip-header">
            <span id="tooltip-name" class="tooltip-streamer-name">Streamer</span>
        </div>

        <div id="tooltip-game-row" class="tooltip-game-row">
            <span class="tooltip-game-icon">🎮</span>
            <span id="tooltip-game" class="tooltip-game-text">Category</span>
        </div>

        <div id="tooltip-title" class="tooltip-title-text">Stream Title</div>

        <div id="tooltip-meta-row" class="tooltip-meta-row">
            <span id="tooltip-domain" class="tooltip-domain-tag">domain.com</span>
        </div>

        <div id="tooltip-meta-row" class="tooltip-meta-row">
            <span id="tooltip-group-tag" class="tooltip-group-tag" style="display: none;">🎨 Group</span>
        </div>

        <div class="tooltip-meta-row">
            <span id="tooltip-history-tag" class="tooltip-history-tag" style="display: none;">📜 Titles/Games: 0</span>
        </div>

        <div id="tooltip-trigger-chip" class="tooltip-trigger-chip" style="display: none;">
            <span class="tooltip-trigger-icon">⚡</span>
            <span id="tooltip-trigger-msg" class="tooltip-trigger-msg"></span>
        </div>
    </div>

    <script>
        const card = document.getElementById("tooltip-card");
        const nameEl = document.getElementById("tooltip-name");
        const domainEl = document.getElementById("tooltip-domain");
        const groupTagEl = document.getElementById("tooltip-group-tag");
        const historyTagEl = document.getElementById("tooltip-history-tag");
        const gameRowEl = document.getElementById("tooltip-game-row");
        const gameEl = document.getElementById("tooltip-game");
        const titleEl = document.getElementById("tooltip-title");
        const triggerChipEl = document.getElementById("tooltip-trigger-chip");
        const triggerMsgEl = document.getElementById("tooltip-trigger-msg");

        if (window.electronAPI && window.electronAPI.onTooltipData) {
            window.electronAPI.onTooltipData((data) => {
                if (!data) return;

                nameEl.textContent = data.name || "Streamer";
                domainEl.textContent = data.domain || "";
                domainEl.style.display = data.domain ? "inline-block" : "none";

                if (data.groupName) {
                    groupTagEl.textContent = `🎨 ${data.groupName}`;
                    groupTagEl.style.display = "inline-block";
                } else {
                    groupTagEl.style.display = "none";
                }

                const historyCount = Number(data.historyCount) || 0;
                if (historyCount > 0) {
                    historyTagEl.textContent = `📜 Titles/Games: ${historyCount}`;
                    historyTagEl.style.display = "inline-block";
                } else {
                    historyTagEl.style.display = "none";
                }

                const gameText = data.game && data.game !== "(---)" ? data.game.trim() : "";
                if (gameText) {
                    gameEl.textContent = gameText;
                    gameRowEl.style.display = "flex";
                } else {
                    gameRowEl.style.display = "none";
                }

                titleEl.textContent = data.title || "No Title";

                const triggerMsg = data.lastTrigger?.message || data.lastTrigger?.label || null;
                if (triggerMsg) {
                    triggerMsgEl.textContent = triggerMsg;
                    triggerChipEl.style.display = "flex";
                } else {
                    triggerChipEl.style.display = "none";
                }

                if (data.liveBorderColor && data.isLive) {
                    card.style.borderColor = data.liveBorderColor;
                } else {
                    card.style.borderColor = "rgba(148, 163, 184, 0.25)";
                }
            });
        }

        // Auto-measure content dimension and report to Electron main process
        const observer = new ResizeObserver(() => {
            const rect = card.getBoundingClientRect();
            const width = Math.ceil(rect.width);
            const height = Math.ceil(rect.height);
            if (window.electronAPI && window.electronAPI.updateTooltipSize) {
                window.electronAPI.updateTooltipSize({ width, height });
            }
        });

        observer.observe(card);
    </script>
</body>

</html>
